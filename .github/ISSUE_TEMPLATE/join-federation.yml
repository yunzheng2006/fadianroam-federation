name: Join FadianRoam Federation
description: Apply to join the FadianRoam Federation as a new Site
title: "[Join] <your-realm>.fadianroam.net"
labels: ["join-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## FadianRoam Federation Join Request
        Please fill in the following information. After approval by the Governance Committee, an admin will configure your Site in the federation.

  - type: input
    id: realm
    attributes:
      label: Realm
      description: "Your FadianRoam realm (e.g. example.fadianroam.net)"
      placeholder: "example.fadianroam.net"
    validations:
      required: true

  - type: input
    id: site_name
    attributes:
      label: Site Name
      description: "Human-readable name for your Site"
      placeholder: "Example Network Lab"
    validations:
      required: true

  - type: input
    id: wg_pubkey
    attributes:
      label: WireGuard Public Key
      description: "Your MGMT VPN WireGuard public key (run: wg genkey | tee privkey | wg pubkey)"
      placeholder: "abc123...="
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact
      description: "Telegram handle or email for coordination"
      placeholder: "@username or email"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: "Any additional information (ASN, location, existing RADIUS setup, etc.)"
